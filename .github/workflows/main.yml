name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.10'
  DEFAULT_DATASET: backend/evaluation/eval_dataset.jsonl

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Lint with Ruff
      run: ruff check .
      
    - name: Format with Black
      run: black --check .
      
    - name: Type check with Mypy
      run: mypy backend
      
    - name: Run all tests
      run: PYTHONPATH=. pytest backend/tests -v --ignore=backend/tests/e2e
      
    - name: Security unit tests
      run: PYTHONPATH=. pytest backend/tests/unit/test_security_jwt.py backend/tests/unit/test_security_audit.py backend/tests/unit/test_security_prompt_injection.py backend/tests/unit/test_security_rate_limit.py backend/tests/unit/test_security_rbac.py -v
      
    - name: Generate benchmark dataset
      run: PYTHONPATH=. python scripts/generate_test_docs.py
      
    - name: Quick evaluation smoke test
      run: PYTHONPATH=. python scripts/run_eval.py --limit 2 --verbose

  evaluation:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Generate benchmark dataset
      run: PYTHONPATH=. python scripts/generate_test_docs.py
      
    - name: Validate dataset structure
      run: |
        python -c "
        import json
        with open('${{ env.DEFAULT_DATASET }}') as f:
            for i, line in enumerate(f, 1):
                obj = json.loads(line.strip())
                assert 'query' in obj and 'expected_answer' in obj and 'contexts' in obj
        print(f'Dataset validated: {i} samples')
        "
        
    - name: Unit tests for evaluation
      run: PYTHONPATH=. pytest backend/tests/unit/test_evaluation_agent.py backend/tests/unit/test_evaluation_runner.py backend/tests/unit/test_evaluation_queue.py -v
        
    - name: Integration tests for evaluation
      run: PYTHONPATH=. pytest backend/tests/integration/test_evaluation_pipeline.py -v
      
    - name: E2E tests for evaluation
      run: PYTHONPATH=. pytest backend/tests/e2e/test_evaluation_e2e.py -v -k "not TestRedisQueueLifecycle"
      
    - name: Full offline evaluation (limit=5)
      run: PYTHONPATH=. python scripts/run_eval.py --limit 5 --verbose
      
    - name: Upload evaluation report
      uses: actions/upload-artifact@v3
      with:
        name: evaluation-results
        path: eval_results/
        
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-reports
        path: |
          eval_results/
          **/pytest*.xml

  build-and-push:
    needs: [lint-and-test, evaluation]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push API
      uses: docker/build-push-action@v4
      with:
        context: .
        file: infra/docker/Dockerfile.api
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/self-healing-rag-api:latest
