apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-rag-chroma
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
    app.kubernetes.io/component: chroma
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Keep one replica serving during updates
  selector:
    matchLabels:
      app.kubernetes.io/component: chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/component: chroma
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:latest
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          env:
            - name: IS_PERSISTENT
              value: "true"
            - name: PERSIST_DIRECTORY
              value: "/chroma/chroma-data"
            - name: ANONYMIZED_TELEMETRY
              value: "false"
            - name: ALLOW_RESET
              value: "false"
          volumeMounts:
            - name: chroma-data
              mountPath: /chroma/chroma-data
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: chroma-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data-pvc
  namespace: self-healing-rag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: chroma-service
  namespace: self-healing-rag
spec:
  ports:
    - port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/component: chroma
