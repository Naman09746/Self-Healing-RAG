apiVersion: v1
kind: ConfigMap
metadata:
  name: self-healing-rag-config
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
    app.kubernetes.io/component: api
data:
  # Application
  PROJECT_NAME: "Self-Healing RAG Pipeline"
  API_V1_STR: "/api/v1"
  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  # Model
  MODEL_NAME: "mistral:7b"
  EMBEDDING_MODEL: "nomic-embed-text"
  # Vector Store (pluggable — free-tier default pgvector)
  VECTOR_STORE_PROVIDER: "pgvector"
  VECTOR_STORE_DIM: "768"
  PGVECTOR_EF_SEARCH: "40"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION_NAME: "rag_collection"
  CHROMA_ALLOW_RESET: "false"
  QDRANT_URL: "http://qdrant-service:6333"
  QDRANT_COLLECTION_NAME: "rag_collection"
  PINECONE_INDEX_NAME: "rag-collection"
  # Session / Sparse / Reranker / Graph (free-tier: pg / pg_tsvector / none / memory)
  SESSION_STORE_PROVIDER: "pg"
  SESSION_TTL: "3600"
  SPARSE_PROVIDER: "pg_tsvector"
  RERANKER_PROVIDER: "none"
  RERANKER_MODEL: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  GRAPH_PROVIDER: "memory"
  NEO4J_ENABLED: "false"
  # Redis (only when SESSION_STORE_PROVIDER=redis)
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # Database
  POSTGRES_SERVER: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "self_healing_rag"
  # Observability
  OTEL_CONSOLE_EXPORT: "false"
  OTEL_SERVICE_NAME: "self-healing-rag"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  LANGSMITH_PROJECT: "self-healing-rag"
  # Rate Limiting
  RATE_LIMIT_REQUESTS: "60"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  MAX_CONCURRENT_QUERIES: "5"
  QUERY_TIMEOUT_SECONDS: "120"
  # Grounding
  GROUNDING_THRESHOLD: "0.7"
