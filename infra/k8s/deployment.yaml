apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-rag-api
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: self-healing-rag
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deploys
  selector:
    matchLabels:
      app.kubernetes.io/name: self-healing-rag
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-healing-rag
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "false"
    spec:
      # Security context — Pod level
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Graceful shutdown
      terminationGracePeriodSeconds: 60
      # Service account for cloud IAM if needed
      serviceAccountName: self-healing-rag-api
      automountServiceAccountToken: false
      # Pod priority
      priorityClassName: high-priority
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - api
                topologyKey: kubernetes.io/hostname
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - chroma
                        - postgres
                        - redis
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: api
          image: self-healing-rag-api:latest
          imagePullPolicy: Always
          ports:
            - name: http-api
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 8000
              protocol: TCP
          # Environment from ConfigMap + Secrets
          envFrom:
            - configMapRef:
                name: self-healing-rag-config
            - secretRef:
                name: self-healing-rag-secrets
          # Explicit env overrides for service discovery
          env:
            - name: OLLAMA_HOST
              value: "http://ollama-service:11434"
            - name: CHROMA_HOST
              value: "chroma-service"
            - name: REDIS_HOST
              value: "redis-service"
            - name: NEO4J_URI
              value: "bolt://neo4j-service:7687"
          # Resource limits & requests
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          # Readiness probe — signals when pod is ready to serve traffic
          readinessProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # Liveness probe — restarts pod if unresponsive
          livenessProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          # Startup probe — gives slow-to-start pods extra time
          startupProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # Container security context
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          # Persistent volume for audit logs
          volumeMounts:
            - name: audit-logs
              mountPath: /app/audit_logs
              readOnly: false
            - name: temp-uploads
              mountPath: /app/temp_uploads
              readOnly: false
            - name: eval-results
              mountPath: /app/eval_results
              readOnly: false
            - name: tmp
              mountPath: /tmp
              readOnly: false
      volumes:
        - name: audit-logs
          emptyDir:
            sizeLimit: "500Mi"
        - name: temp-uploads
          emptyDir:
            sizeLimit: "1Gi"
        - name: eval-results
          emptyDir:
            sizeLimit: "500Mi"
        - name: tmp
          emptyDir:
            sizeLimit: "100Mi"
