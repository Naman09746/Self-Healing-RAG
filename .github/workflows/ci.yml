# Self-Healing RAG — Continuous Integration
#
# Triggered on pushes and pull requests to main/master.
# Runs linting, unit tests, integration tests, and evaluation E2E smoke test.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.10"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy backend

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (evaluation + security)
        run: |
          pytest \
            backend/tests/unit/test_evaluation_agent.py \
            backend/tests/unit/test_evaluation_runner.py \
            backend/tests/unit/test_evaluation_queue.py \
            -v --tb=short

      - name: Run other unit tests
        run: |
          pytest \
            backend/tests/unit/ \
            --ignore=backend/tests/unit/test_evaluation_agent.py \
            --ignore=backend/tests/unit/test_evaluation_runner.py \
            --ignore=backend/tests/unit/test_evaluation_queue.py \
            -v --tb=short

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          pytest backend/tests/integration/test_evaluation_pipeline.py -v --tb=short

  e2e-smoke:
    name: E2E Smoke (no Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run CLI smoke test
        run: |
          python scripts/run_eval.py --limit 2

      - name: Run E2E tests (dataset + CLI + offline)
        run: |
          export PYTHONPATH=.
          pytest \
            backend/tests/e2e/test_evaluation_e2e.py \
            -v --tb=short \
            -k "not Redis" \
            --e2e

  e2e-full:
    name: E2E Full (with Redis)
    runs-on: ubuntu-latest
    needs: [unit, integration]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Redis is reachable
        run: redis-cli -h localhost -p 6379 ping

      - name: Run full E2E tests (including Redis queue)
        run: |
          export PYTHONPATH=.
          export REDIS_URL="redis://localhost:6379/0"
          pytest \
            backend/tests/e2e/test_evaluation_e2e.py \
            -v --tb=short \
            --e2e