[project]
name = "self-healing-rag"
version = "0.1.0"
description = "A production-grade Self-Healing Multi-Agent RAG Pipeline"
authors = [
    { name = "Naman Joshi", email = "naman@example.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic-settings>=2.0.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.2",
    "ollama>=0.1.0",
    "chromadb>=0.4.0",
    "pgvector>=0.3.0",
    "qdrant-client>=1.7.0",
    "pinecone>=3.2.0",
    "greenlet>=3.0.0",
    "redis>=5.0.0",
    "asyncpg>=0.28.0",
    "structlog>=23.1.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "rank-bm25>=0.2.2",
    "neo4j>=5.14.0",
    "python-multipart>=0.0.6",
    "pymupdf>=1.23.0",
    "tenacity>=8.2.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "langsmith>=0.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg>=3.1.0",
    "prometheus-client>=0.21.0",
    "ragas>=0.1.0",
    "datasets>=2.14.0",
    "sentence-transformers>=2.2.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.7.0",
    "mypy>=1.5.0",
    "httpx>=0.24.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: marks end-to-end tests (requires full system integration)",
]

[project.scripts]
aes = "backend.experiments.cli:app"

[tool.setuptools]
packages = ["backend"]
