---
# Secrets for Self-Healing RAG
# In production, use sealed-secrets, external-secrets, or vault.
# These are placeholder values — override via your secret management tool.
apiVersion: v1
kind: Secret
metadata:
  name: self-healing-rag-secrets
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  SECRET_KEY: "change-me-to-a-random-64-char-hex-string-in-production"
  # Generate RSA keypair for JWT: python -c "from backend.core.security import generate_rsa_keypair; print(generate_rsa_keypair())"
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""
  # Database
  DATABASE_URL: "postgresql+asyncpg://raguser:changeme@postgres-service:5432/self_healing_rag"
  # LangGraph checkpoint URI (sync variant for psycopg)
  LANGGRAPH_CHECKPOINT_URI: "postgresql://raguser:changeme@postgres-service:5432/self_healing_rag?sslmode=disable"
  # Redis
  REDIS_PASSWORD: ""
  # LangSmith (if used)
  LANGSMITH_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: self-healing-rag-db-secrets
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
type: Opaque
stringData:
  POSTGRES_USER: "raguser"
  POSTGRES_PASSWORD: "changeme"
  POSTGRES_DB: "self_healing_rag"
---
apiVersion: v1
kind: Secret
metadata:
  name: self-healing-rag-neo4j-secrets
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
type: Opaque
stringData:
  NEO4J_AUTH: "neo4j/changeme"
  NEO4J_PASSWORD: "changeme"
