apiVersion: v1
kind: Service
metadata:
  name: self-healing-rag-api
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: self-healing-rag
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
    # For AWS NLB / GCP HTTPS LB
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
spec:
  type: ClusterIP
  ports:
    - name: http-api
      port: 80
      targetPort: http-api
      protocol: TCP
    - name: metrics
      port: 8000
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: self-healing-rag
    app.kubernetes.io/component: api
  # Session affinity for streaming connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
