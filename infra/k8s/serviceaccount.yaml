apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing-rag-api
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
    app.kubernetes.io/component: api
  annotations:
    # For AWS IRSA: eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/self-healing-rag
    # For GCP Workload Identity: iam.gke.io/gcp-service-account: rag-sa@project.iam.gserviceaccount.com
    description: "Service account for Self-Healing RAG API pods"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing-rag-api-role
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing-rag-api-rolebinding
  namespace: self-healing-rag
  labels:
    app.kubernetes.io/name: self-healing-rag
subjects:
  - kind: ServiceAccount
    name: self-healing-rag-api
    namespace: self-healing-rag
roleRef:
  kind: Role
  name: self-healing-rag-api-role
  apiGroup: rbac.authorization.k8s.io
