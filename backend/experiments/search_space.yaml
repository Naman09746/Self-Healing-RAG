parameters:
  top_k:
    type: int
    default: 5
    min: 1
    max: 20
    step: 1
    description: "Number of documents retrieved by hybrid retriever"

  hybrid_search_alpha:
    type: float
    default: 0.5
    min: 0.0
    max: 1.0
    step: 0.05
    description: "Weight between vector (dense) and BM25 (sparse) retrieval"

  rerank_threshold:
    type: float
    default: 0.0
    min: 0.0
    max: 1.0
    step: 0.05
    description: "Minimum similarity threshold for reranked chunks"

  routing_confidence_threshold:
    type: float
    default: 0.6
    min: 0.3
    max: 0.95
    step: 0.05
    description: "Confidence threshold for router agent intent classification"

  healing_max_retries:
    type: int
    default: 2
    min: 0
    max: 5
    step: 1
    description: "Maximum self-healing retries for hallucination or low grounding"

  chunk_variant:
    type: categorical
    default: "c700_o100"
    options:
      - "c500_o50"
      - "c700_o100"
      - "c1500_o300"
    collection_mapping:
      c500_o50: "rag_collection_c500_o50"
      c700_o100: "rag_collection_c700_o100"
      c1500_o300: "rag_collection_c1500_o300"
    description: "Pre-computed chunk size and overlap collection variant"
