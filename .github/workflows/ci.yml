# Self-Healing RAG — Continuous Integration & Quality Pipeline
name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.10"
  DEFAULT_DATASET: backend/evaluation/eval_dataset.jsonl

jobs:
  lint-and-unit-tests:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check . || true

      - name: Run Unit Tests
        run: |
          export PYTHONPATH=.
          pytest backend/tests/unit -v --tb=short

      - name: Run Integration Tests
        run: |
          export PYTHONPATH=.
          pytest backend/tests/integration -v --tb=short

      - name: Evaluation CLI Smoke Test
        run: |
          export PYTHONPATH=.
          python scripts/run_eval.py --limit 2 --verbose

  e2e-evaluation:
    name: E2E Evaluation & Queue Test
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run E2E Evaluation Tests
        run: |
          export PYTHONPATH=.
          export REDIS_URL="redis://localhost:6379/0"
          pytest backend/tests/e2e/test_evaluation_e2e.py -v --tb=short --e2e

      - name: Upload Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: eval_results/
          if-no-files-found: ignore

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests, e2e-evaluation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DOCKER_CREDS == 'true'
    env:
      HAS_DOCKER_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/self-healing-rag-api:latest